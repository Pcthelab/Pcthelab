name: Update profile activity

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/activity.mjs
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/activity.mjs
      - name: Save activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/activity-mobile.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update profile activity'
          git pull --rebase origin main
          git push
