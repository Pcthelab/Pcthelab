<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350" role="img" aria-labelledby="title desc">
<title id="title">PCTHELAB — Juan Delgado, backend developer</title>
<desc id="desc">Terminal animado com assinatura, glitch sutil, esfera orbital e pulsos de dados. Java e Spring Boot.</desc>
<defs><radialGradient id="halo"><stop stop-color="#223268" stop-opacity=".48"/><stop offset="1" stop-color="#070a10" stop-opacity="0"/></radialGradient>
<linearGradient id="ink"><stop stop-color="#f0f5ff"/><stop offset=".64" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#7787be" stroke-opacity=".065"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="slice"><rect x="0" y="72" width="480" height="12"/><rect x="0" y="106" width="480" height="5"/></clipPath>
<clipPath id="type"><rect class="typing" x="25" y="299" width="410" height="24"/></clipPath></defs>
<style>
@keyframes orbit {to {transform:rotate(360deg)}}
@keyframes reverse {to {transform:rotate(-360deg)}}
@keyframes breathe {0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes glitch {0%,88%,94%,100%{transform:translate(0);opacity:0}89%,92%{transform:translate(5px,-2px);opacity:.75}90%,93%{transform:translate(-4px,1px);opacity:.55}}
@keyframes type {0%,8%{width:0}48%,90%{width:410px}100%{width:0}}
@keyframes cursor {0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes packet {0%{stroke-dashoffset:600;opacity:0}10%,80%{opacity:.9}100%{stroke-dashoffset:0;opacity:0}}
.orbit{animation:orbit 18s linear infinite}.reverse{animation:reverse 12s linear infinite}
.pulse{animation:breathe 4s ease-in-out infinite}.glitch{animation:glitch 7s linear infinite}
.typing{animation:type 9s steps(31,end) infinite}.cursor{animation:cursor 1.1s step-end infinite}
.packet{stroke-dasharray:45 555;animation:packet 5s linear infinite}
@media(prefers-reduced-motion:reduce){.glitch,.cursor,.pulse{animation:none!important}.glitch{opacity:0}.orbit{animation-duration:36s}.reverse{animation-duration:24s}.typing{animation-duration:15s}.packet{animation-duration:12s}}
</style>
<rect width="480" height="350" rx="12" fill="#070a10"/>
<rect x=".5" y=".5" width="479" height="349" rx="12" fill="url(#grid)" stroke="#242239"/>
<path d="M25 56H455" stroke="#242239"/>
<g font-family="'Courier New',monospace" font-size="11" letter-spacing="1.5"><text x="25" y="34" fill="#8b82b1">~/PCTHELAB</text>
<circle cx="344" cy="30" r="3" fill="#67e8f9" class="pulse"/><text x="455" y="34" text-anchor="end" fill="#91a4b9">SOURCE / 01</text></g>

<g fill="url(#ink)"><text x="22" y="122" font-family="Arial,Helvetica,sans-serif" font-size="69" font-weight="900" letter-spacing="-4">PCTHELAB</text></g><g fill="#67e8f9" clip-path="url(#slice)" class="glitch"><text x="22" y="122" font-family="Arial,Helvetica,sans-serif" font-size="69" font-weight="900" letter-spacing="-4">PCTHELAB</text></g>
<g font-family="'Courier New',monospace">
<text x="25" y="157" fill="#a8b2c7" font-size="13" letter-spacing="1.2">JUAN DELGADO <tspan fill="#605878">/</tspan></text>
<text x="25" y="181" fill="#a8b2c7" font-size="12" letter-spacing="1.2">BACKEND DEVELOPER</text><g transform="translate(376 229)">
<circle r="62.230000000000004" fill="url(#halo)"/>
<g fill="none" stroke="#4fe5ff" stroke-width=".8" opacity=".38">
<circle r="49"/><ellipse rx="49" ry="15.68"/><ellipse rx="49" ry="34.3"/>
<ellipse rx="15.68" ry="49"/><ellipse rx="34.3" ry="49"/>
<path d="M-49,0H49M0,-49V49"/></g>
<g class="orbit" fill="none"><ellipse rx="57.82" ry="22.05" transform="rotate(-35)" stroke="#a78bfa" stroke-width="1.7"/>
<circle cx="47.432" cy="-33.173" r="4" fill="#ddd6fe" filter="url(#glow)"/></g>
<g class="reverse" fill="none"><circle r="54.39000000000001" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="24 160 4 70"/>
<circle cy="-54.39000000000001" r="3" fill="#67e8f9" filter="url(#glow)"/></g>
<circle r="6.37" fill="#b4f4ff" opacity=".7" filter="url(#glow)" class="pulse"/>
<path d="M-12,-4L-4,0L-12,4M2,6H11" stroke="#e2fbff" stroke-width="2" fill="none"/>
</g>
<text x="25" y="221" font-size="12" fill="#a78bfa">JAVA <tspan fill="#4b536b">/</tspan> SPRING BOOT</text>
<path d="M25 277H455" stroke="#242239"/>
<path d="M25 277H455" stroke="#a78bfa" stroke-width="1.5" class="packet"/>
<g clip-path="url(#type)"><text x="25" y="317" fill="#67e8f9" font-size="12">&gt; turning ideas into code<tspan class="cursor">_</tspan></text></g>

</g></svg>
