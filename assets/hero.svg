<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">PCTHELAB — Juan Delgado, backend developer</title>
<desc id="desc">Terminal animado com assinatura, glitch sutil, esfera orbital e pulsos de dados. Java e Spring Boot.</desc>
<defs><radialGradient id="halo"><stop stop-color="#223268" stop-opacity=".48"/><stop offset="1" stop-color="#070a10" stop-opacity="0"/></radialGradient>
<linearGradient id="ink"><stop stop-color="#f0f5ff"/><stop offset=".64" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#7787be" stroke-opacity=".065"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="slice"><rect x="0" y="105" width="1000" height="12"/><rect x="0" y="139" width="1000" height="5"/></clipPath>
<clipPath id="type"><rect class="typing" x="44" y="279" width="410" height="24"/></clipPath></defs>
<style>
@keyframes orbit {to {transform:rotate(360deg)}}
@keyframes reverse {to {transform:rotate(-360deg)}}
@keyframes breathe {0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes glitch {0%,88%,94%,100%{transform:translate(0);opacity:0}89%,92%{transform:translate(5px,-2px);opacity:.75}90%,93%{transform:translate(-4px,1px);opacity:.55}}
@keyframes type {0%,8%{width:0}48%,90%{width:410px}100%{width:0}}
@keyframes cursor {0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes packet {0%{stroke-dashoffset:600;opacity:0}10%,80%{opacity:.9}100%{stroke-dashoffset:0;opacity:0}}
.orbit{animation:orbit 18s linear infinite}.reverse{animation:reverse 12s linear infinite}
.pulse{animation:breathe 4s ease-in-out infinite}.glitch{animation:glitch 7s linear infinite}
.typing{animation:type 9s steps(31,end) infinite}.cursor{animation:cursor 1.1s step-end infinite}
.packet{stroke-dasharray:45 555;animation:packet 5s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.glitch{opacity:0}.typing{width:410px}}
</style>
<rect width="1000" height="330" rx="12" fill="#070a10"/>
<rect x=".5" y=".5" width="999" height="329" rx="12" fill="url(#grid)" stroke="#242239"/>
<path d="M44 56H956" stroke="#242239"/>
<g font-family="'Courier New',monospace" font-size="11" letter-spacing="1.5"><text x="44" y="34" fill="#8b82b1">~/PCTHELAB</text>
<circle cx="845" cy="30" r="3" fill="#67e8f9" class="pulse"/><text x="956" y="34" text-anchor="end" fill="#91a4b9">SOURCE / 01</text></g>
<g transform="translate(815 164)">
<circle r="105.41" fill="url(#halo)"/>
<g fill="none" stroke="#4fe5ff" stroke-width=".8" opacity=".38">
<circle r="83"/><ellipse rx="83" ry="26.560000000000002"/><ellipse rx="83" ry="58.099999999999994"/>
<ellipse rx="26.560000000000002" ry="83"/><ellipse rx="58.099999999999994" ry="83"/>
<path d="M-83,0H83M0,-83V83"/></g>
<g class="orbit" fill="none"><ellipse rx="97.94" ry="37.35" transform="rotate(-35)" stroke="#a78bfa" stroke-width="1.7"/>
<circle cx="80.344" cy="-56.191" r="4" fill="#ddd6fe" filter="url(#glow)"/></g>
<g class="reverse" fill="none"><circle r="92.13000000000001" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="24 160 4 70"/>
<circle cy="-92.13000000000001" r="3" fill="#67e8f9" filter="url(#glow)"/></g>
<circle r="10.790000000000001" fill="#b4f4ff" opacity=".7" filter="url(#glow)" class="pulse"/>
<path d="M-12,-4L-4,0L-12,4M2,6H11" stroke="#e2fbff" stroke-width="2" fill="none"/>
</g>
<g fill="url(#ink)"><text x="41" y="155" font-family="Arial,Helvetica,sans-serif" font-size="106" font-weight="900" letter-spacing="-7">PCTHELAB</text></g><g fill="#67e8f9" clip-path="url(#slice)" class="glitch"><text x="41" y="155" font-family="Arial,Helvetica,sans-serif" font-size="106" font-weight="900" letter-spacing="-7">PCTHELAB</text></g>
<g font-family="'Courier New',monospace">
<text x="44" y="192" fill="#a8b2c7" font-size="16" letter-spacing="1.2">JUAN DELGADO <tspan fill="#605878">/</tspan> BACKEND DEVELOPER</text>

<text x="44" y="226" font-size="13" fill="#a78bfa">JAVA <tspan fill="#4b536b">/</tspan> SPRING BOOT</text>
<path d="M44 257H956" stroke="#242239"/>
<path d="M44 257H956" stroke="#a78bfa" stroke-width="1.5" class="packet"/>
<g clip-path="url(#type)"><text x="44" y="297" fill="#67e8f9" font-size="13">&gt; turning ideas into code<tspan class="cursor">_</tspan></text></g>
<text x="956" y="297" text-anchor="end" fill="#6d7591" font-size="10" letter-spacing="2">BUILD. BREAK. LEARN.</text>
</g></svg>
